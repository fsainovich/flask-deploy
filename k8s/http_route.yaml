apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flask-env-var  
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "flask.home.fsainovich.tec.br"
    external-dns.alpha.kubernetes.io/target: "*.{{ home.fsainovich.tec.br }}"
spec:
  parentRefs:
    - name: "default-gateway"
      namespace: "default-gateway"
  hostnames:
    - "flask.home.fsainovich.tec.br"
  rules:
    - backendRefs:
      - name: flask-env-var-service
        port: 80
